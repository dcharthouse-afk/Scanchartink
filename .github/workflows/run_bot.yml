name: Chartink Morning Scanner Bot

on:
  schedule:
    # 1st Trigger: 08:12 AM IST (02:42 UTC) - Queue delay se bachne ke liye 1 ghanta pehle
    - cron: '42 2 * * 1-5'
    # 2nd Backup Trigger: 08:42 AM IST (03:12 UTC) - Agar pehla miss ho jaye
    - cron: '12 3 * * 1-5'
    # 3rd Backup Trigger: 09:12 AM IST (03:42 UTC)
    - cron: '42 3 * * 1-5'
  workflow_dispatch:

# Ek time par SIRF 1 BOT chalne dega! Duplicate bots ko rok dega.
concurrency:
  group: chartink-morning-scanner-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 250 # ~4 Hours (8:12 AM se 12:20 PM IST tak ke liye kaafi hai)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scanner script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u main.py
        continue-on-error: true

      # Bot band hone par aaj ke stocks ki memory GitHub me save karega
      - name: Save Alert Memory
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json || true
          git diff --staged --quiet || (git commit -m "Update alert state [skip ci]" && git pull --rebase && git push)
